<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="description" content="Digital Python Notes - a complete, multilingual Python learning application with a live in-browser code runner, by Code Origin.AI Private Limited." />
  <meta name="theme-color" content="#0a0e17" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#eef2f9" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Python Notes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>Digital Python Notes | Code Origin.AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/premium.css" />
</head>
<body>
  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>

    <a class="brand" href="#/" aria-label="Digital Python Notes home">
      <span class="brand-logo">🐍</span>
      <span class="brand-text">
        <span class="brand-title">Digital Python Notes</span>
        <span class="brand-sub" id="brandSub">by Code Origin.AI</span>
      </span>
    </a>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="search" id="searchInput" placeholder="Search…" autocomplete="off" />
      <kbd class="search-kbd">/</kbd>
      <div class="search-results" id="searchResults" hidden></div>
    </div>

    <div class="topbar-actions">
      <div class="lang-wrap" id="langWrap">
        <button class="icon-btn lang-btn" id="langBtn" aria-label="Change language">
          <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c2.5 2.5 3.5 6 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-6-3.5-9s1-6.5 3.5-9z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <span class="lang-cur" id="langCur">English</span>
          <span class="caret">▼</span>
        </button>
        <div class="lang-menu" id="langMenu" hidden></div>
      </div>

      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle light / dark">
        <svg class="theme-icon-dark" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="theme-icon-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar" aria-label="Navigation drawer">
      <button type="button" class="sidebar-close-btn" id="sidebarClose" aria-label="Close navigation menu" title="Close menu">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
      <div class="sidebar-inner">
        <a class="ws-link" id="wsLink" href="#/workspace"><span class="ws-ico">▶</span>Workspace</a>
        <a class="ws-link ai-link" id="aiLink" href="#/ai-explain"><span class="ws-ico">🤖</span>AI Explain</a>
        <a class="ws-link iv-link" id="ivLink" href="#/interview"><span class="ws-ico">🎯</span>Interview Prep</a>
        <a class="ws-link rf-link" id="rfLink" href="#/interview/rapid-fire"><span class="ws-ico">⚡</span>Rapid Fire</a>
        <a class="ws-link dash-link" id="dashLink" href="#/interview/dashboard"><span class="ws-ico">📊</span>Dashboard</a>
        <div class="sidebar-head">
          <span class="sidebar-label" id="sidebarLabel">Syllabus</span>
          <span class="sidebar-count" id="moduleCount">42 Modules</span>
        </div>
        <nav class="nav" id="moduleNav" aria-label="Modules"></nav>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="content" id="content" tabindex="-1"></main>
  </div>

  <!-- ============ ENGINE ============ -->
  <script src="js/i18n.js"></script>
  <script src="js/highlight.js"></script>
  <script src="js/explainer.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>

  <!-- ============ CONTENT (self-registers onto window.DP) ============ -->
  <script src="data/modules/module-01.js"></script>
  <script src="data/modules/module-02.js"></script>
  <script src="data/modules/module-03.js"></script>
  <script src="data/modules/module-04.js"></script>
  <script src="data/modules/module-05.js"></script>
  <script src="data/modules/module-06.js"></script>
  <script src="data/modules/module-07.js"></script>
  <script src="data/modules/module-08.js"></script>
  <script src="data/modules/module-09.js"></script>
  <script src="data/modules/module-10-42.js"></script>
  <script src="data/modules/module-43-44.js"></script>
  <script src="data/interview.js"></script>
  <script src="data/interview-meta.js"></script>
  <script src="data/interactive-challenges.js"></script>
  <script src="data/roles-and-scenarios.js"></script>
  <script src="data/system-design-and-jd.js"></script>

  <script>window.DP.boot();</script>
</body>
</html>
